<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06060a"/>
      <stop offset="50%" stop-color="#0c0d16"/>
      <stop offset="100%" stop-color="#08080f"/>
    </linearGradient>
    <radialGradient id="evoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="400" cy="225" r="260" fill="url(#evoGlow)"/>

  <!-- Evo 2 Biological sequence token grid -->
  <g transform="translate(180, 100)">
    <rect width="440" height="230" rx="8" fill="#0e0f1c" stroke="rgba(139,92,246,0.3)" stroke-width="1.5"/>
    
    <!-- Token embeddings visual representation -->
    <g transform="translate(35, 35)">
      <text x="0" y="20" fill="#2dd4bf" font-family="monospace" font-size="12">LLM Context</text>
      <rect x="0" y="30" width="140" height="40" rx="4" fill="rgba(45,212,191,0.1)" stroke="#2dd4bf" stroke-width="1"/>
      <text x="15" y="55" fill="#dddde8" font-family="monospace" font-size="11">Prompt &amp; Goals</text>

      <!-- Bridge arrows -->
      <line x1="150" y1="50" x2="220" y2="50" stroke="#a78bfa" stroke-width="2" stroke-dasharray="4 2"/>
      <polygon points="216,46 224,50 216,54" fill="#a78bfa"/>

      <!-- Evo 2 Foundation Model -->
      <g transform="translate(230, 0)">
        <text x="0" y="20" fill="#a78bfa" font-family="monospace" font-size="12">Evo 2 Bio-LM</text>
        <rect x="0" y="30" width="140" height="40" rx="4" fill="rgba(139,92,246,0.15)" stroke="#a78bfa" stroke-width="1"/>
        <text x="15" y="55" fill="#ffffff" font-family="monospace" font-size="11">Genomic Prior</text>
      </g>
    </g>

    <!-- Synthetic output genome slice -->
    <g transform="translate(35, 125)">
      <line x1="0" y1="0" x2="370" y2="0" stroke="rgba(255,255,255,0.08)"/>
      <text x="0" y="25" fill="#6e6d7a" font-family="monospace" font-size="10">SYNTHESIZED CODING SEQUENCE WITH EMBEDDINGS</text>
      
      <!-- Sequence bars -->
      <g transform="translate(0, 38)">
        <rect x="0" y="0" width="28" height="18" rx="2" fill="#2dd4bf" opacity="0.8"/>
        <text x="9" y="13" fill="#06060a" font-family="monospace" font-size="10" font-weight="bold">A</text>

        <rect x="34" y="0" width="28" height="18" rx="2" fill="#60a5fa" opacity="0.8"/>
        <text x="43" y="13" fill="#06060a" font-family="monospace" font-size="10" font-weight="bold">T</text>

        <rect x="68" y="0" width="28" height="18" rx="2" fill="#fbbf24" opacity="0.8"/>
        <text x="77" y="13" fill="#06060a" font-family="monospace" font-size="10" font-weight="bold">G</text>

        <rect x="102" y="0" width="28" height="18" rx="2" fill="#f43f5e" opacity="0.8"/>
        <text x="111" y="13" fill="#06060a" font-family="monospace" font-size="10" font-weight="bold">C</text>

        <rect x="136" y="0" width="28" height="18" rx="2" fill="#2dd4bf" opacity="0.8"/>
        <text x="145" y="13" fill="#06060a" font-family="monospace" font-size="10" font-weight="bold">A</text>

        <rect x="170" y="0" width="28" height="18" rx="2" fill="#a78bfa" opacity="0.8"/>
        <text x="179" y="13" fill="#06060a" font-family="monospace" font-size="10" font-weight="bold">A</text>

        <text x="215" y="14" fill="#6e6d7a" font-family="monospace" font-size="12">... [1M+ NT Context]</text>
      </g>
    </g>
  </g>

  <text x="180" y="375" fill="#ffffff" font-family="serif" font-size="20" font-style="italic" font-weight="200">LLM_for_EVO2</text>
  <text x="180" y="395" fill="#6e6d7a" font-family="sans-serif" font-size="11" letter-spacing="2">BRIDGING LLM REASONING WITH EVO 2 BIOLOGICAL EMBEDDINGS</text>
</svg>
