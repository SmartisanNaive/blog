<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06060a"/>
      <stop offset="50%" stop-color="#0c0d16"/>
      <stop offset="100%" stop-color="#08080f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="400" cy="225" r="240" fill="url(#glow)"/>

  <!-- Star count badge in top-right -->
  <g transform="translate(600, 45)">
    <rect width="110" height="32" rx="16" fill="rgba(45,212,191,0.12)" stroke="#2dd4bf" stroke-width="1"/>
    <text x="55" y="21" fill="#2dd4bf" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">★ 119 STARS</text>
  </g>

  <!-- Central Card -->
  <rect x="180" y="95" width="440" height="250" rx="8" fill="#10101d" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Code/Text Window -->
  <g font-family="monospace" font-size="13">
    <!-- Redacted / Cleaned AI watermark text line -->
    <text x="215" y="150" fill="#6e6d7a">As an AI language model, I recommend...</text>
    <line x1="210" y1="145" x2="570" y2="145" stroke="#f43f5e" stroke-width="2.5" opacity="0.8"/>

    <text x="215" y="195" fill="#2dd4bf" font-weight="bold">&gt; ai-cleaner sanitize input.md --strip-signatures</text>
    
    <text x="215" y="240" fill="#34d399">✔ 404: AI signature not found.</text>
    <text x="215" y="275" fill="#dddde8">Result: Pure developer intent &amp; clean prose.</text>
  </g>

  <!-- Clean icon stamp -->
  <g transform="translate(520, 260)">
    <circle cx="20" cy="20" r="18" fill="rgba(45,212,191,0.15)" stroke="#2dd4bf" stroke-width="1.5"/>
    <path d="M 13,20 L 18,25 L 28,14" fill="none" stroke="#2dd4bf" stroke-width="2"/>
  </g>

  <text x="180" y="385" fill="#ffffff" font-family="serif" font-size="20" font-style="italic" font-weight="200">AI-Cleaner</text>
  <text x="180" y="405" fill="#6e6d7a" font-family="sans-serif" font-size="11" letter-spacing="2">OPEN-SOURCE TEXT SANITIZATION &amp; SIGNATURE CLEANER</text>
</svg>
