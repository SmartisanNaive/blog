<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06060a"/>
      <stop offset="50%" stop-color="#0c0d16"/>
      <stop offset="100%" stop-color="#08080f"/>
    </linearGradient>
    <radialGradient id="glow" cx="60%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="480" cy="180" r="260" fill="url(#glow)"/>

  <!-- Terminal Window Shell -->
  <rect x="140" y="70" width="520" height="300" rx="8" fill="#0d0e18" stroke="rgba(45,212,191,0.25)" stroke-width="1.5"/>
  <rect x="140" y="70" width="520" height="34" rx="8" fill="#141524"/>
  <!-- Traffic lights -->
  <circle cx="165" cy="87" r="5" fill="#f87171" opacity="0.8"/>
  <circle cx="182" cy="87" r="5" fill="#fbbf24" opacity="0.8"/>
  <circle cx="199" cy="87" r="5" fill="#34d399" opacity="0.8"/>
  <text x="400" y="92" fill="#6e6d7a" font-family="monospace" font-size="11" text-anchor="middle">biofoundry_cli — agent shell</text>

  <!-- Terminal lines -->
  <g font-family="monospace" font-size="12" fill="#dddde8">
    <text x="170" y="140" fill="#2dd4bf">&gt; biofoundry init --profile yeast-chassis</text>
    <text x="170" y="170" fill="#6e6d7a">[info] Loading SynPan MCP server &amp; SangerAlign v2.4...</text>
    <text x="170" y="200" fill="#a78bfa">[agent] Synthesizing Golden Gate assembly primers (4 fragments)</text>
    
    <!-- Code block / alignment diagram inside terminal -->
    <text x="170" y="235" fill="#38bdf8">REF : ATGCGATCGAAGCTAGCTAGCTAGCTGATCGAT</text>
    <text x="170" y="260" fill="#2dd4bf">ALN : ATGCGATCGAAGCTAGCTAGCTAGCTGATCGAT  [100% MATCH]</text>
    
    <text x="170" y="300" fill="#34d399">✔ Spec verified. Dispatching to CIAI pipeline.</text>
    <text x="170" y="335" fill="#2dd4bf">&gt; █</text>
  </g>

  <!-- DNA Double Helix schematic in bottom right -->
  <path d="M 520,310 Q 560,280 600,310 T 680,310" fill="none" stroke="#2dd4bf" stroke-width="2" opacity="0.5"/>
  <path d="M 520,330 Q 560,360 600,330 T 680,330" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.5"/>
</svg>
