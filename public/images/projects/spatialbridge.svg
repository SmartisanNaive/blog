<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06060a"/>
      <stop offset="50%" stop-color="#0c0d16"/>
      <stop offset="100%" stop-color="#08080f"/>
    </linearGradient>
    <radialGradient id="meshGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  
  <!-- Heatmap simulation grid (MALDI Imaging representation) -->
  <g transform="translate(140, 90)">
    <rect width="300" height="260" rx="6" fill="#0d0e1a" stroke="rgba(45,212,191,0.3)" stroke-width="1.5"/>
    <!-- Heatmap clusters -->
    <circle cx="150" cy="130" r="90" fill="url(#meshGrad)"/>
    <ellipse cx="130" cy="110" rx="55" ry="40" fill="#2dd4bf" fill-opacity="0.35"/>
    <ellipse cx="170" cy="150" rx="45" ry="50" fill="#60a5fa" fill-opacity="0.3"/>
    <circle cx="120" cy="100" r="25" fill="#f43f5e" fill-opacity="0.4"/>
    <circle cx="175" cy="160" r="20" fill="#fbbf24" fill-opacity="0.4"/>

    <!-- Pixel coordinates -->
    <path d="M 60,60 L 240,60 L 240,200 L 60,200 Z" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="70" y="50" fill="#2dd4bf" font-family="monospace" font-size="10">m/z: 785.421 [M+H]+</text>
    <text x="210" y="220" fill="#6e6d7a" font-family="monospace" font-size="9">10 µm / spot</text>
  </g>

  <!-- WebAssembly & Lazy Slicing Pipeline Indicator -->
  <g transform="translate(480, 110)">
    <!-- WASM Box -->
    <rect x="0" y="20" width="200" height="60" rx="4" fill="#121324" stroke="rgba(96,165,250,0.4)" stroke-width="1"/>
    <text x="20" y="45" fill="#60a5fa" font-family="monospace" font-size="12" font-weight="bold">h5wasm (WebWorker)</text>
    <text x="20" y="65" fill="#6e6d7a" font-family="monospace" font-size="10">WORKERFS Lazy Slicing</text>

    <!-- Arrow -->
    <line x1="100" y1="80" x2="100" y2="120" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="4 2"/>
    <polygon points="96,120 104,120 100,126" fill="#2dd4bf"/>

    <!-- Browser Canvas Rendering -->
    <rect x="0" y="130" width="200" height="60" rx="4" fill="#121324" stroke="rgba(45,212,191,0.4)" stroke-width="1"/>
    <text x="20" y="155" fill="#2dd4bf" font-family="monospace" font-size="12" font-weight="bold">Zero-Upload Canvas</text>
    <text x="20" y="175" fill="#6e6d7a" font-family="monospace" font-size="10">Local MSI SBD / HDF5</text>
  </g>

  <text x="140" y="390" fill="#ffffff" font-family="serif" font-size="20" font-style="italic" font-weight="200">SpatialBridge</text>
  <text x="140" y="410" fill="#6e6d7a" font-family="sans-serif" font-size="11" letter-spacing="2">MALDI MASS SPECTROMETRY EDGE SBD EXTRACTION</text>
</svg>
